<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创世纪 · 文化迁徙长卷</title>
<style>
  :root{
    --paper:#e9dcba; --paper-deep:#dccc9e; --ink:#1f3a5f; --ink-soft:#5a6b80;
    --cinnabar:#b5392a; --cinnabar-deep:#93291c; --gold:#a07c2c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#dccc9e;overflow:hidden;font-family:"Noto Serif SC","STKaiti","KaiTi","STSong",serif}
  #scroll{position:relative;height:100vh;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab}
  #scroll::-webkit-scrollbar{display:none}
  #scroll.dragging{cursor:grabbing}
  #juan{display:block;height:100vh;width:auto}
  #flow{position:absolute;left:0;top:0;pointer-events:none}
  .st{opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}
  .st.on{opacity:1;transform:none}
  /* ===== 站点触发动画 ===== */
  /* 第一站：火苗跳动 + 声波扩散 */
  #st1 .flames{transform-box:view-box;transform-origin:900px 508px}
  #st1.on .flames{animation:flick 1.5s ease-in-out infinite}
  @keyframes flick{0%,100%{transform:scale(1,1)}28%{transform:scale(.95,1.09)}55%{transform:scale(1.05,.93)}78%{transform:scale(.97,1.05)}}
  #st1 .wave path{transform-box:view-box;transform-origin:900px 382px}
  #st1.on .wave path{animation:wv 2.6s ease-out infinite}
  #st1.on .wave path:nth-child(2){animation-delay:.35s}
  #st1.on .wave path:nth-child(3){animation-delay:.15s}
  #st1.on .wave path:nth-child(4){animation-delay:.5s}
  @keyframes wv{0%{opacity:.85;transform:scale(1)}75%{opacity:.12;transform:scale(1.22)}100%{opacity:0;transform:scale(1.26)}}
  /* 第二站：竹笔刻写轨迹 */
  #st2.on .pen{animation:carve 3.4s ease-in-out infinite}
  @keyframes carve{0%,100%{transform:translate(0,0)}25%{transform:translate(-30px,-32px)}50%{transform:translate(-56px,-6px)}75%{transform:translate(-28px,10px)}}
  #st2 .carve-line{stroke-dasharray:200;stroke-dashoffset:200}
  #st2.on .carve-line{animation:draw 3.4s ease-in-out infinite}
  @keyframes draw{0%{stroke-dashoffset:200}40%{stroke-dashoffset:0}75%{stroke-dashoffset:0}100%{stroke-dashoffset:200}}
  /* 第三站：经卷缓缓展开 */
  #st3 .pgL,#st3 .pgR{transform-box:view-box;transform-origin:3060px 430px}
  #st3.on .pgL{animation:unf 1.5s cubic-bezier(.3,.7,.3,1) .35s both}
  #st3.on .pgR{animation:unf 1.5s cubic-bezier(.3,.7,.3,1) .5s both}
  @keyframes unf{from{transform:scaleX(.08)}to{transform:scaleX(1)}}
  /* 第四站：书本翻开 + 文字飞出 */
  #st4 .cover{transform-box:view-box;transform-origin:4095px 400px}
  #st4.on .cover{animation:coveropen 1.8s ease .3s both}
  @keyframes coveropen{from{transform:scaleX(1)}to{transform:scaleX(.04)}}
  #st4 .fly-t{opacity:0}
  #st4.on .fly-t{animation:flyup 3.4s ease-out infinite}
  @keyframes flyup{0%{opacity:0;transform:translateY(0)}12%{opacity:.95}70%{opacity:.5}100%{opacity:0;transform:translateY(-110px)}}
  /* 第五站：手机屏幕亮起 */
  #st5 .scr{fill:#26303c;transition:fill 1.5s ease .35s}
  #st5.on .scr{fill:#eef4f6}
  #st5 .love,#st5 .ui{opacity:0;transition:opacity 1.1s ease}
  #st5.on .love{opacity:1;transition-delay:1.1s}
  #st5.on .ui{opacity:1;transition-delay:1.5s}
  #st5 .phone{transition:filter 1.5s ease .8s}
  #st5.on .phone{filter:drop-shadow(0 0 16px rgba(240,200,120,.5))}
  .qr{transform:translate(5470px,296px);transition:transform .3s}
  a:hover .qr{transform:translate(5470px,288px)}
  /* 卷尾回声卡 */
  .card{transition:transform .3s;transform-box:view-box}
  a:hover .card{transform:translateY(-8px)}
  /* ===== 漂浮东巴字 ===== */
  .flo{position:fixed;width:64px;opacity:.16;pointer-events:none;z-index:2;
    animation:floaty var(--d,24s) ease-in-out infinite alternate}
  @keyframes floaty{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(9px,-20px) rotate(var(--r,8deg))}100%{transform:translate(-7px,-36px) rotate(0deg)}}
  /* ===== 史诗脉络时间线 ===== */
  #tlBtn{position:fixed;left:26px;bottom:14px;z-index:12;font-family:inherit;font-size:14px;letter-spacing:3px;color:var(--ink);
    background:rgba(242,231,205,.92);border:1.5px solid var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;
    box-shadow:0 2px 10px rgba(60,40,10,.25)}
  #tlBtn:hover{background:#f6eed7}
  #tlBtn.off{display:none}
  #tlSheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:#f2e7cd;border-top:3px solid var(--ink);
    box-shadow:0 -8px 28px rgba(60,40,10,.3);padding:16px 28px 22px;transform:translateY(112%);transition:transform .45s cubic-bezier(.3,.8,.3,1)}
  #tlSheet.open{transform:none}
  .tl-head{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;letter-spacing:4px;color:var(--ink)}
  #tlClose{cursor:pointer;font-size:26px;color:var(--cinnabar-deep);padding:0 8px;line-height:1}
  .tl-nodes{position:relative;display:flex;justify-content:space-around;gap:16px;margin-top:14px}
  .tl-nodes::before{content:'';position:absolute;left:9%;right:9%;top:33px;border-top:2.5px solid var(--cinnabar);opacity:.55}
  .tl-node{position:relative;z-index:1;width:210px;text-align:center}
  .tl-img{display:inline-block;background:#f2e7cd;border-radius:50%;padding:8px}
  .tl-img img{width:52px;height:auto;vertical-align:middle}
  .tl-node b{display:block;margin-top:6px;font-size:19px;color:var(--cinnabar-deep);letter-spacing:3px}
  .tl-node p{margin-top:5px;font-size:13.5px;line-height:1.75;color:var(--ink-soft)}
  /* ===== 进度条与站点导航 ===== */
  #pbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
    background:rgba(242,231,205,.88);border:1.5px solid var(--ink);border-radius:999px;padding:7px 16px;z-index:9;
    box-shadow:0 2px 10px rgba(60,40,10,.25);backdrop-filter:blur(2px)}
  #pbar .track{position:relative;width:min(38vw,300px);height:4px;background:#c9b78c;border-radius:2px}
  #pbar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cinnabar);border-radius:2px;transition:width .15s}
  #pbar .dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#e9dcba;border:2px solid var(--ink);
    transform:translate(-50%,-50%);cursor:pointer}
  #pbar .dot.cur{background:var(--cinnabar);border-color:var(--cinnabar-deep)}
  #pbar .lbl{font-size:12px;color:var(--ink);letter-spacing:2px;white-space:nowrap}
  /* 开场提示 */
  #hint{position:fixed;right:26px;bottom:60px;z-index:9;color:var(--cinnabar-deep);font-size:15px;letter-spacing:3px;
    writing-mode:vertical-rl;animation:hintmove 1.6s ease-in-out infinite;transition:opacity .6s;pointer-events:none}
  #hint.gone{opacity:0}
  @keyframes hintmove{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
  @media (max-width:600px){
    #pbar .lbl{display:none}
    #hint{font-size:13px;bottom:70px}
    #tlBtn{bottom:64px;font-size:13px;padding:7px 14px}
    .tl-nodes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .tl-nodes::before{display:none}
    .tl-node{width:auto}
    #tlSheet{max-height:52vh;overflow-y:auto}
    .flo{width:44px}
  }
</style>
</head>

  function maxLeft(){ return sc.scrollWidth - sc.clientWidth; }
  function stopLeft(x){ return Math.max(0, Math.min(maxLeft(), x*scale() - sc.clientWidth/2 + 200)); }

  // 进度点
  var track = document.getElementById('track'), fill = document.getElementById('fill');

  function onScroll(){
    var p = maxLeft() ? sc.scrollLeft/maxLeft() : 0;
    fill.style.width = (p*100) + '%';
    var cx = sc.scrollLeft + sc.clientWidth/2, best = 0, bd = 1e9;
    stops.forEach(function(s,i){ var d = Math.abs(stopLeft(s.x)+sc.clientWidth/2-cx); if(d<bd){bd=d;best=i;} });
    dots.forEach(function(d,i){ d.classList.toggle('cur', i===best); });
    if (sc.scrollLeft > 40) hint.classList.add('gone');
  }
  sc.addEventListener('scroll', onScroll);

  // 滚轮 → 横向
  sc.addEventListener('wheel', function(e){
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); sc.scrollLeft += e.deltaY*1.4; }
  }, {passive:false});

  // 拖拽
  var down=false, sx=0, sl=0;
  sc.addEventListener('pointerdown', function(e){ down=true; sx=e.clientX; sl=sc.scrollLeft; sc.classList.add('dragging'); sc.setPointerCapture(e.pointerId); });
  sc.addEventListener('pointermove', function(e){ if(down) sc.scrollLeft = sl - (e.clientX-sx); });
  ['pointerup','pointercancel'].forEach(function(t){ sc.addEventListener(t, function(){ down=false; sc.classList.remove('dragging'); }); });

  // 键盘
  window.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight') sc.scrollLeft += 300;
    if(e.key==='ArrowLeft') sc.scrollLeft -= 300;
  });

  // 入场动效
  var io = new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('on'); io.unobserve(en.target); } });
  }, {root: sc, threshold: 0.25});
  document.querySelectorAll('.st').forEach(function(el){ io.observe(el); });

  // 时间线开关
  var tlSheet = document.getElementById('tlSheet'), tlBtn = document.getElementById('tlBtn');
  tlBtn.onclick = function(){ tlSheet.classList.toggle('open'); tlBtn.classList.toggle('off', tlSheet.classList.contains('open')); };
  document.getElementById('tlClose').onclick = function(){ tlSheet.classList.remove('open'); tlBtn.classList.remove('off'); };

  // ===== 红河流动粒子 =====
  var cv = document.getElementById('flow'), ctx = cv.getContext('2d');
  ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  function fitCanvas(){ var r = svg.getBoundingClientRect(); cv.style.width = r.width+'px'; cv.style.height = r.height+'px'; }
  window.addEventListener('resize', fitCanvas); fitCanvas();

  var main_line = [[640,575],[770,600],[900,630],[1200,652],[1650,616],[1960,576],[2300,585],[2700,626],[3060,640],[3450,620],[3850,586],[4160,574],[4550,585],[4950,618],[5260,628],[5650,618],[6050,596],[6330,600]];
  var trib_line = [[6010,598],[6120,640],[6260,668],[6384,694]];
  var wknots = [[640,10],[900,12],[1650,18],[1960,20],[2700,27],[3060,28],[3850,37],[4160,38],[4950,47],[5260,46],[6050,33],[6330,30]];
  function build(path){ var segs=[], L=0;
    for (var i=0;i<path.length-1;i++){ var a=path[i], b=path[i+1], l=Math.hypot(b[0]-a[0], b[1]-a[1]); segs.push({a:a,b:b,l:l,c:L}); L+=l; }
    return {segs:segs, L:L};
  }
  var MAIN = build(main_line), TRIB = build(trib_line);
  function widthAt(x){
    for (var i=0;i<wknots.length-1;i++){ var p=wknots[i], q=wknots[i+1];
      if (x<=q[0]){ var t=Math.max(0,Math.min(1,(x-p[0])/(q[0]-p[0]))); return p[1]+(q[1]-p[1])*t; } }
    return 30;
  }
  function pointOn(bd, t){
    var d = t*bd.L, s = bd.segs[bd.segs.length-1];
    for (var i=0;i<bd.segs.length;i++){ if (d <= bd.segs[i].c + bd.segs[i].l){ s = bd.segs[i]; break; } }
    var u = (d - s.c)/s.l;
    return { x: s.a[0]+(s.b[0]-s.a[0])*u, y: s.a[1]+(s.b[1]-s.a[1])*u,
             dx:(s.b[0]-s.a[0])/s.l, dy:(s.b[1]-s.a[1])/s.l };
  }
  var P = [];
  for (var i=0;i<120;i++){
    P.push({ t:Math.random(), sp:0.006+Math.random()*0.012, ph:Math.random()*6.28,
             fr:0.5+Math.random()*1.2, r:1+Math.random()*2.6, tri:Math.random()<0.14, lite:Math.random()<0.62 });
  }
  var last = 0;
  function frame(ts){
    requestAnimationFrame(frame);
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts-last)/1000); last = ts;
    if (document.hidden) return;
    ctx.clearRect(0, 0, 7600, 900);
    for (var i=0;i<P.length;i++){ var p = P[i];
      p.t += p.sp*dt; if (p.t > 1){ p.t -= 1; p.ph = Math.random()*6.28; }
      var q = pointOn(p.tri ? TRIB : MAIN, p.t);
      var w = p.tri ? 9 : widthAt(q.x);
      var off = Math.sin(ts/1000*p.fr + p.ph) * w * 0.36;
      var x = q.x - q.dy*off, y = q.y + q.dx*off;
      var a = (0.14 + 0.5*Math.sin(Math.PI*p.t)) * (p.lite ? 1 : 0.85);
      ctx.strokeStyle = p.lite ? ('rgba(238,175,140,'+a+')') : ('rgba(122,32,20,'+(a*0.8)+')');
      ctx.lineWidth = p.r; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x-q.dx*6, y-q.dy*6); ctx.lineTo(x+q.dx*6, y+q.dy*6); ctx.stroke();
    }
  }
  requestAnimationFrame(frame);

  onScroll();
})();
</script>
</body>
</html>
