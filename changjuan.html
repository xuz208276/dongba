<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创世纪 · 文化迁徙长卷</title>
<style>
  :root{
    --paper:#e9dcba; --paper-deep:#dccc9e; --ink:#1f3a5f; --ink-soft:#5a6b80;
    --cinnabar:#b5392a; --cinnabar-deep:#93291c; --gold:#a07c2c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#dccc9e;overflow:hidden;font-family:"Noto Serif SC","STKaiti","KaiTi","STSong",serif}
  #scroll{height:100vh;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab}
  #scroll::-webkit-scrollbar{display:none}
  #scroll.dragging{cursor:grabbing}
  #juan{display:block;height:100vh;width:auto}
  .st{opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}
  .st.on{opacity:1;transform:none}
  image.g{mix-blend-mode:multiply}
  .seal-img{filter:invert(1) brightness(2.4);mix-blend-mode:screen}
  /* 进度条与站点导航 */
  #pbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
    background:rgba(242,231,205,.88);border:1.5px solid var(--ink);border-radius:999px;padding:7px 16px;z-index:9;
    box-shadow:0 2px 10px rgba(60,40,10,.25);backdrop-filter:blur(2px)}
  #pbar .track{position:relative;width:min(38vw,300px);height:4px;background:#c9b78c;border-radius:2px}
  #pbar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cinnabar);border-radius:2px;transition:width .15s}
  #pbar .dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#e9dcba;border:2px solid var(--ink);
    transform:translate(-50%,-50%);cursor:pointer}
  #pbar .dot.cur{background:var(--cinnabar);border-color:var(--cinnabar-deep)}
  #pbar .lbl{font-size:12px;color:var(--ink);letter-spacing:2px;white-space:nowrap}
  /* 开场提示 */
  #hint{position:fixed;right:26px;bottom:60px;z-index:9;color:var(--cinnabar-deep);font-size:15px;letter-spacing:3px;
    writing-mode:vertical-rl;animation:hintmove 1.6s ease-in-out infinite;transition:opacity .6s;pointer-events:none}
  #hint.gone{opacity:0}
  @keyframes hintmove{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
  @media (max-width:600px){#pbar .lbl{display:none}#hint{font-size:13px;bottom:70px}}
</style>
</head>

<div id="hint">向右徐徐展开 ⇢</div>
<script src="scroll-glyphs.js"></script>
<script>
(function(){
  // 注入字图
  document.querySelectorAll('image.g').forEach(function(im){
    var k = im.getAttribute('data-g');
    if (typeof GLYPHS !== 'undefined' && GLYPHS[k]) { im.setAttribute('href', GLYPHS[k]); im.setAttributeNS('http://www.w3.org/1999/xlink','href', GLYPHS[k]); }
  });

  var sc = document.getElementById('scroll');
  var svg = document.getElementById('juan');

  // 站点锚点（viewBox 坐标 → 实际像素）
  var stops = [
    {x:0,    t:'卷首'}, {x:900, t:'火塘声波'}, {x:1960, t:'木石初痕'},
    {x:3060, t:'经卷仪礼'}, {x:4160, t:'铅字学术'}, {x:5260, t:'掌间像素'}, {x:6400, t:'新芽'}
  ];
  function scale(){ return svg.getBoundingClientRect().width / 6700; }
  function maxLeft(){ return sc.scrollWidth - sc.clientWidth; }
  function stopLeft(x){ return Math.max(0, Math.min(maxLeft(), x*scale() - sc.clientWidth/2 + 200)); }

  // 进度点
  var track = document.getElementById('track'), fill = document.getElementById('fill');
  var dots = stops.map(function(s, i){
    var d = document.createElement('div'); d.className = 'dot'; d.title = s.t;
    d.style.left = (i/(stops.length-1)*100) + '%';
    d.onclick = function(){ sc.scrollTo({left: stopLeft(s.x), behavior:'smooth'}); };
    track.appendChild(d); return d;
  });

  function onScroll(){
    var p = maxLeft() ? sc.scrollLeft/maxLeft() : 0;
    fill.style.width = (p*100) + '%';
    var cx = sc.scrollLeft + sc.clientWidth/2, best = 0, bd = 1e9;
    stops.forEach(function(s,i){ var d = Math.abs(stopLeft(s.x)+sc.clientWidth/2-cx); if(d<bd){bd=d;best=i;} });
    dots.forEach(function(d,i){ d.classList.toggle('cur', i===best); });
    if (sc.scrollLeft > 40) hint.classList.add('gone');
  }
  sc.addEventListener('scroll', onScroll);

  // 滚轮 → 横向
  sc.addEventListener('wheel', function(e){
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); sc.scrollLeft += e.deltaY*1.4; }
  }, {passive:false});

  // 拖拽
  var down=false, sx=0, sl=0;
  sc.addEventListener('pointerdown', function(e){ down=true; sx=e.clientX; sl=sc.scrollLeft; sc.classList.add('dragging'); sc.setPointerCapture(e.pointerId); });
  sc.addEventListener('pointermove', function(e){ if(down) sc.scrollLeft = sl - (e.clientX-sx); });
  ['pointerup','pointercancel'].forEach(function(t){ sc.addEventListener(t, function(){ down=false; sc.classList.remove('dragging'); }); });

  // 键盘
  window.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight') sc.scrollLeft += 300;
    if(e.key==='ArrowLeft') sc.scrollLeft -= 300;
  });

  // 入场动效
  var io = new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('on'); io.unobserve(en.target); } });
  }, {root: sc, threshold: 0.25});
  document.querySelectorAll('.st').forEach(function(el){ io.observe(el); });

  var hint = document.getElementById('hint');
  onScroll();
})();
</script>
